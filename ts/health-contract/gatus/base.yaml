# The topology-independent half of the Auto-Pigeon Gatus configuration.
#
# Gatus (https://github.com/TwiN/gatus, Apache-2.0) is the health monitor the Auto-Pigeon stack
# ships with. This file is the part of its configuration that is the same on every machine: what
# the dashboard is called, how history is stored, how hard it probes. It contains NO endpoint, NO
# host, NO port and NO secret, because none of those is knowable here — they belong to one running
# stack and are generated by auto-pigeon-tools from the same resolver that launches it.
#
# auto-pigeon-tools reads this file, appends the `endpoints:` block for the active topology, and
# writes the result into that stack's runtime directory. Editing this file changes every stack;
# editing a generated file changes one launch and is overwritten by the next.
#
# The `path` below is a CONTAINER path. The host directory bind-mounted onto /data is the durable
# runtime boundary auto-pigeon-tools resolves ($MAPPER_ROOT/runtime/auto-pigeon-health/), and no
# monitoring data is ever stored in Git or in this repository.

storage:
  # SQLite rather than memory, so a Gatus restart does not erase the history an operator restarted
  # it to look at. Rather than inventing storage: this is one of Gatus' own supported backends.
  type: sqlite
  path: /data/gatus.db

web:
  # The container port. What it is PUBLISHED as on the host is a topology question and is decided
  # by auto-pigeon-tools, which shifts it with AUP_PORT_OFFSET like every other port in the stack.
  port: 8080

ui:
  title: Auto-Pigeon stack health
  header: Auto-Pigeon
  description: Component liveness and build versions for one Auto-Pigeon stack.
  # Failing endpoints first: the dashboard exists to be glanced at, and a glance should land on
  # whatever is wrong rather than on whatever sorts first alphabetically.
  default-sort-by: health

# How many endpoints are probed at once. The stack is small — five to seven endpoints — so this
# only bounds the burst; it is not a throughput setting.
concurrency: 4
